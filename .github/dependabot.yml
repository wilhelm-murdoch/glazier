# Weekly, grouped updates: one PR per ecosystem instead of one per bump.
# The github-actions ecosystem also keeps the SHA-pinned actions in
# .github/workflows/ current (it rewrites the SHA and the version comment).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # The harness base images are pinned by digest. Each tag is a test target,
  # so Dependabot updates only the digest and never moves a tag to a new release.
  - package-ecosystem: docker
    directory: /test/e2e
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      harness-images:
        patterns: ["*"]

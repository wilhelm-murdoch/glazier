# OpenSSF Scorecard: audits the repo's supply-chain posture (pinned actions,
# token permissions, branch protection, ...) and publishes the score so the
# README badge and https://scorecard.dev stay current.
name: Scorecard

on:
  push:
    # Default branch only: the action's publish step is rejected by the
    # OpenSSF API for any other ref, and Scorecard audits repo-level posture
    # rather than branch code anyway.
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "15 11 * * 6" # Saturdays 11:15 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to the OpenSSF REST API
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: results.sarif

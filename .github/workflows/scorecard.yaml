# OpenSSF Scorecard: audits the repo's supply-chain posture (pinned actions,
# token permissions, branch protection, ...) and publishes the score so the
# README badge and https://scorecard.dev stay current.
name: Scorecard

on:
  push:
    # Default branch only: the action's publish step is rejected by the
    # OpenSSF API for any other ref, and Scorecard audits repo-level posture
    # rather than branch code anyway.
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "15 11 * * 6" # Saturdays 11:15 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to the OpenSSF REST API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

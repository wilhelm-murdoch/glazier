# Releasing is: push a semver tag (e.g. `git tag v0.2.0 && git push origin
# v0.2.0` — the Forgejo mirror forwards tags). This re-verifies the tagged
# commit, cross-compiles the version-stamped binaries via `make release`,
# runs the end-to-end cases against those exact zips on real tmux binaries,
# and only then publishes a GitHub Release with the zips, the .deb, .rpm and
# .apk packages and notes generated from the merged PRs since the previous tag.
# After that, it pushes the formula to the Homebrew tap and the PKGBUILD to the
# AUR, so a failed push never blocks or changes the release.
#
# The e2e gate tests what ships, not a fresh build: each job unzips the
# release asset for its platform and checks that `glaze --version` reports
# the tag. Each e2e job blocks the release: linux/amd64 and linux/arm64 on
# all six tmux targets, and darwin/arm64 on the macOS host.
#
# Run the workflow by hand (Actions > Release > Run workflow) for a dry run
# before you tag: it builds the zips and runs every e2e job on them, checks
# only the form of the version line and does not publish.
name: Release

on:
  push:
    tags: ["v*"]
  # A manual run is a dry run: it builds the zips and runs every e2e job on them, but it does not publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: make vet
      - run: make test
      - run: make race
      - run: make e2e-check

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the Makefile stamps the version from `git describe --tags`
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make release STAGE=production # builds the zips, the .deb, .rpm and .apk packages and SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            release/*/*.zip
            release/*/*.deb
            release/*/*.rpm
            release/*/*.apk
            release/SHA256SUMS
          if-no-files-found: error

  e2e-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # SHA256SUMS names each zip without its directory, so the check runs in the directory of the zip.
      - name: Verify and unzip the release asset
        run: |
          cd "release/linux-${{ matrix.arch }}"
          shasum -a 256 -c ../SHA256SUMS --ignore-missing
          unzip -o "glaze-linux-${{ matrix.arch }}.zip" -d "$RUNNER_TEMP/glaze"
      - name: Run the cases on every tmux target
        working-directory: e2e
        run: go run ./cmd/matrix -arch "${{ matrix.arch }}" -glaze "$RUNNER_TEMP/glaze/glaze" -expect-version "$EXPECT_VERSION" -markdown "$RUNNER_TEMP/e2e.md"
        env:
          # Only a tag has a version to expect; a dry run checks only the form of the version line.
          EXPECT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - if: always()
        run: cat "$RUNNER_TEMP/e2e.md" >> "$GITHUB_STEP_SUMMARY" || true
      # Keep the reports and logs of every run: a flaky check on base passes the job, but its detail is still needed.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-linux-${{ matrix.arch }}
          retention-days: 14
          path: |
            e2e/results/**/*.jsonl
            e2e/results/**/*.log
            e2e/results/summary.md

  e2e-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - run: brew install tmux fish
      # SHA256SUMS names each zip without its directory, so the check runs in the directory of the zip.
      - name: Verify and unzip the release asset
        run: |
          cd release/darwin-arm64
          shasum -a 256 -c ../SHA256SUMS --ignore-missing
          unzip -o glaze-darwin-arm64.zip -d "$RUNNER_TEMP/glaze"
      - name: Run the cases on the macOS host
        working-directory: e2e
        run: go test -count=1 ./cases/
        env:
          GLAZE_BIN: ${{ runner.temp }}/glaze/glaze
          E2E_REQUIRE: "1"
          E2E_TARGET: macos
          E2E_EXPECT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  release:
    needs: [build, e2e-linux, e2e-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation (sigstore)
      attestations: write # store the attestation in the repo's attestation log
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # Signed build provenance for every zip: verifiable offline with
      # `gh attestation verify <zip> --repo ${{ github.repository }}`. The
      # sigstore bundle is also attached to the Release below so the
      # provenance survives independently of GitHub's attestation API (and
      # is visible to the Scorecard Signed-Releases check).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            release/*/*.zip
            release/*/*.deb
            release/*/*.rpm
            release/*/*.apk
      - run: cp "${{ steps.attest.outputs.bundle-path }}" release/attestations.intoto.jsonl
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            release/*/*.zip \
            release/*/*.deb \
            release/*/*.rpm \
            release/*/*.apk \
            release/SHA256SUMS \
            release/attestations.intoto.jsonl

  # Installs the rendered formula from a local copy of the tap and runs its test before the push.
  homebrew:
    needs: release
    # render.sh accepts only a vX.Y.Z tag, so a pre-release gets no formula.
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: macos-latest
    # The release environment holds the deploy key and allows only v* tags.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wilhelm-murdoch/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Render and commit the formula
        run: |
          mkdir -p tap/Formula
          packaging/render.sh "$GITHUB_REF_NAME" release/SHA256SUMS packaging/homebrew/glazier.rb > tap/Formula/glazier.rb
          cd tap
          git add Formula/glazier.rb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "glazier $GITHUB_REF_NAME"
      - name: Install and test the formula
        run: |
          brew tap wilhelm-murdoch/tap "$PWD/tap"
          brew style wilhelm-murdoch/tap/glazier
          brew install wilhelm-murdoch/tap/glazier
          brew test wilhelm-murdoch/tap/glazier
      - run: git -C tap push origin HEAD

  # Checks the rendered PKGBUILD with makepkg in an Arch container before the push.
  aur:
    needs: release
    # pacman does not accept a pre-release version such as 1.0.0-rc1; set the AUR_ENABLED repo variable to true once AUR_SSH_KEY exists.
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-') && vars.AUR_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The release environment holds the AUR key and allows only v* tags.
    environment: release
    env:
      GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.aur-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ github.workspace }}/packaging/aur/known_hosts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Install the AUR key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -m 600 /dev/null .aur-key
          printf '%s\n' "$AUR_SSH_KEY" > .aur-key
      - name: Render the PKGBUILD and .SRCINFO
        run: |
          git clone ssh://aur@aur.archlinux.org/glazier-bin.git aur
          packaging/render.sh "$GITHUB_REF_NAME" release/SHA256SUMS packaging/aur/PKGBUILD > aur/PKGBUILD
          # makepkg refuses to run as root; --verifysource downloads the published zips and checks them against the PKGBUILD.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/aur":/pkg -w /pkg archlinux:base \
            bash -c 'makepkg --verifysource && makepkg --printsrcinfo > .SRCINFO'
          rm -f aur/*.zip
      - name: Commit and push
        working-directory: aur
        run: |
          git add PKGBUILD .SRCINFO
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "glazier-bin ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master

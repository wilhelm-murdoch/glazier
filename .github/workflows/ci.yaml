# Tests, race detection, lint, and coverage. Steps delegate to Makefile
# targets wherever possible so this stays in lockstep with the Woodpecker
# pipeline (.woodpecker/workflow.yaml) and local runs — change the Makefile,
# not this file. Actions are pinned to commit SHAs (the tag in the comment is
# informational); dependabot keeps them fresh.
#
# tmux is installed on every leg so the end-to-end test (pkg/tmux/e2e_test.go)
# actually runs instead of self-skipping. There is no Windows leg: tmux has no
# native Windows build, so neither does glaze.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # "1.26.x" is the declared minimum in go.mod; "stable" tracks the
        # newest Go release so we hear about breakage before consumers do.
        go: ["1.26.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: make vet
      - run: make test

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: make race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint

  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: make cover # enforces the floor defined in the Makefile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

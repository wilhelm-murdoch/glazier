# Scans dependencies and the call graph with Go's official vulnerability
# scanner. The weekly cron matters: new CVEs land against unchanged code,
# so PR-only scanning would miss them. The scanner version is pinned in the
# Makefile; the vulnerability database is always fetched live.
name: govulncheck

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "30 9 * * 1" # Mondays 09:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln

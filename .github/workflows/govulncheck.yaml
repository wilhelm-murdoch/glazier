# Scans dependencies and the call graph with Go's official vulnerability
# scanner. The weekly cron matters: new CVEs land against unchanged code,
# so PR-only scanning would miss them. The scanner version is pinned in the
# Makefile; the vulnerability database is always fetched live.
name: govulncheck

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "30 9 * * 1" # Mondays 09:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln

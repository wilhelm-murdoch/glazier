# GitHub's static analysis. Findings land in the repository's Security tab.
# The schedule re-analyzes unchanged code as new queries are added.
name: CodeQL

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
  # No paths-ignore on pull_request: with "Require code scanning results" branch
  # protection on, a PR touching only ignored paths skips CodeQL entirely, so it
  # never uploads results and the required gate waits forever. Code-only PRs are
  # unaffected; this guarantees every PR produces a result that satisfies it.
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "45 10 * * 3" # Wednesdays 10:45 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: go
      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:go"

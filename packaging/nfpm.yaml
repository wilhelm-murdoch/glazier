# The Makefile runs nfpm once per packager and architecture, with PKG_ARCH and PKG_VERSION in the environment.
name: glazier
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: Wilhelm Murdoch <wilhelm@devilmayco.de>
description: Declarative tmux workspaces from HCL profiles
vendor: Wilhelm Codes
homepage: https://github.com/wilhelm-murdoch/glazier
license: MIT

depends:
  - tmux

contents:
  - src: ./release/linux-${PKG_ARCH}/glaze
    dst: /usr/bin/glaze
    expand: true
    file_info:
      mode: 0755

  - src: ./LICENSE.md
    dst: /usr/share/doc/glazier/copyright
    packager: deb
    file_info:
      mode: 0644

  - src: ./LICENSE.md
    dst: /usr/share/licenses/glazier/LICENSE
    packager: rpm
    file_info:
      mode: 0644

  - src: ./LICENSE.md
    dst: /usr/share/licenses/glazier/LICENSE
    packager: apk
    file_info:
      mode: 0644
